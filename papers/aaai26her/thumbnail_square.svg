<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
<title>LTLfMT pipeline with HER and CRM</title>
<desc>Top: an LTLfMT two-goal formula compiled into a reward machine. Bottom: an agent interacts with the product MDP; rollouts populate two overlapping replay buffers (CRM and HER) that share transitions and jointly update the agent.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .ts { font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
</style>

<defs>
<marker id="ars" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="292" y="42" text-anchor="middle" class="mono" font-size="20" fill="#0F4751">φ  =  ◇ ( <tspan fill="#B85C3C" font-weight="500">‖x − g₁‖² ≤ ε</tspan>  ∧  ◇ <tspan fill="#D49A2E" font-weight="500">‖x − g₂‖² ≤ ε</tspan> )</text>
<text x="292" y="64" text-anchor="middle" class="ts" fill="#1F6E7A">reach goal g₁, then reach goal g₂</text>

